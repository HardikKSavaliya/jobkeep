# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
# RustSec advisory database
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",          # ICU crates (via url/idna)
    "CDLA-Permissive-2.0",  # webpki-roots (Mozilla CA bundle)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []