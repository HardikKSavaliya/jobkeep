[package]
name = "jobkeep-server"
description = "JobKeep worker runtime: fetches, executes and retries jobs; runs the cron scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
jobkeep-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
chrono.workspace = true
cron.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
jobkeep-core = { workspace = true, features = ["macros"] }
tracing-subscriber.workspace = true
jobkeep-memory.workspace = true
jobkeep-client.workspace = true
serde.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true