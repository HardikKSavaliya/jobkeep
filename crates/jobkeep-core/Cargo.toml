[package]
name = "jobkeep-core"
description = "Core types and traits for JobKeep: jobs, states, storage trait, cron parsing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Re-export #[job] etc., like serde's `derive` feature
macros = ["dep:jobkeep-macros"]
# Conformance suite for `Storage` backends (`jobkeep_core::testing`)
testing = ["dep:tokio"]

[dependencies]
jobkeep-macros = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
cron.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde.workspace = true

[[test]]
name = "macros"
required-features = ["macros"]

[lints]
workspace = true